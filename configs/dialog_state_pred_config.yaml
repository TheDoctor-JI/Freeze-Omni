model_path: "checkpoints"
llm_path: "Qwen2-7B-Instruct"
device: 'cuda:1' 
thread_sleep_interval: 0.005
debug_time: False


vad:
  use_standalone_vad: true # From start_monitoring.sh, line 48 (flag is present)
  vad_threshold: 0.5 # From PureVAD.py, line 16
  min_silent_duration_second: 0.15 # From PureVAD.py, line 17 (300ms)
  speech_pad_second: 0.03 # From PureVAD.py, line 18 (30ms)
  vad_history_cache_chunk_cnt: 2 # From PureVAD.py, line 10


audio_feature_gating:
  feature_gating_history_size: 10 # From AudioFeatureGating.py, line 14
  onset_input_chunk_cache_size: 0 # From AudioFeatureGating.py, line 15

  fbank:
    feat_dim: 80 # From AudioFeatureGating.py, line 10

    
    minimal_processing_chunk_duration: 0.21 ## 210ms, as dictated by the performance of the sub-sequent modules

    audio_to_proc_per_step_in_sec: 0.016
    step_size_in_sec: 0.008
    context_duration_in_env_sent_chunk: 1 ## Preserve a number of audio chunks for context

inference_control:
  top_k: 5 # From server_alt.py, line 35 (argparse default is 5)
  top_p: 0.8 # From server_alt.py, line 36 (argparse default is 0.8)
  temperature: 0.7 # From server_alt.py, line 37 (argparse default is 0.7)
  # default_prompt: "You are a helpful voice assistant. Your answer should be coherent, natural, simple, complete. Your name is Xiao Yun. Your inventor is Tencent." # From server_alt.py, line 90
  default_prompt: "Start new response if the user provided new information or gave new instructions." # From server_alt.py, line 90


dialog_state_decision:
  resp_threshold: 0.5